<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily</title>
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F4F1E8">
<script>
  // Apply this device's saved appearance before the first paint (see js/theme.js).
  try {
    var t = localStorage.getItem('daily.theme');
    if (t === 'dark' || t === 'auto') {
      document.documentElement.dataset.theme = t;
      document.querySelector('meta[name="color-scheme"]').content = t === 'auto' ? 'light dark' : 'dark';
      var dark = t === 'dark' || matchMedia('(prefers-color-scheme: dark)').matches;
      document.querySelector('meta[name="theme-color"]').content = dark ? '#151914' : '#F4F1E8';
    }
  } catch (e) {}
</script>

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daily">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;600&family=Karla:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="shell">
  <p id="flash" class="flash" hidden></p>
  <div id="banner" class="banner" hidden></div>
  <main id="view">
    <noscript><p>Daily needs JavaScript. It runs entirely in the browser.</p></noscript>
  </main>
</div>
<div id="toast" class="toast" hidden></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
