<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily · design fixture</title>
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;600&family=Karla:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/app.css">
</head>
<body>
<!--
  Design fixture. Renders the views against fixed sample data with no token and
  no network, so layout can be checked without touching real data.
  Not linked from the app. Safe to delete.
-->
<div class="shell">
  <main id="view"></main>
</div>

<script type="module">
import { renderToday } from '../js/views/today.js';
import { renderCalendar } from '../js/views/calendar.js';
import { syncBadge } from '../js/components/syncbadge.js';
import { normaliseAnchor } from '../js/calendar.js';

const TODAY = '2026-08-04';

const task = (over) => ({
  type: 'task', project: null, experiment: null, done: false, completedAt: null,
  createdAt: '2026-08-04T08:00:00Z', source: 'app', notes: '', scope: 'lab', ...over,
});

let n = 0;
const t = (title, due, over = {}) => task({ id: `t${n += 1}`, title, due, ...over });

const state = {
  version: 1,
  updatedAt: `${TODAY}T09:00:00Z`,
  projects: ['Globot', 'PEG Treatment', 'Root Atlas'],
  experiments: [
    { id: 'E0013_PegTreatment', label: 'PEG drought', project: 'PEG Treatment', startDate: '2026-07-28', active: true, milestones: [] },
    { id: 'GB005', label: 'GB005', project: 'Globot', startDate: null, active: true, milestones: [] },
  ],
  tasks: [
    // Past, completed — the record of what happened.
    t('Transfer seedlings to PEG plates', '2026-07-28', { project: 'PEG Treatment', experiment: 'E0013_PegTreatment', done: true, completedAt: '2026-07-28T14:00:00Z' }),
    t('Sow GB005 batch one', '2026-07-29', { project: 'Globot', experiment: 'GB005', done: true, completedAt: '2026-07-29T10:00:00Z' }),
    t('Scan root plates', '2026-07-30', { project: 'Root Atlas', done: true, completedAt: '2026-07-30T16:00:00Z' }),
    t('Dentist', '2026-07-30', { scope: 'personal', type: 'appointment', done: true, completedAt: '2026-07-30T17:00:00Z' }),
    t('Weigh fresh mass', '2026-08-01', { project: 'PEG Treatment', done: true, completedAt: '2026-08-01T11:00:00Z' }),

    // Overdue.
    t('Refresh PEG plates before the recovery transfer', '2026-08-02', { project: 'PEG Treatment', experiment: 'E0013_PegTreatment' }),
    t('Email Jose about the growth chamber', '2026-08-03'),

    // Today.
    t('Image roots at 6 days post-treatment', TODAY, { project: 'PEG Treatment', experiment: 'E0013_PegTreatment' }),
    t('Sow seeds for GB005', TODAY, { project: 'Globot', experiment: 'GB005' }),
    t('Order more square petri dishes', TODAY, { project: 'Globot' }),
    t('Pick up prescription', TODAY, { scope: 'personal' }),

    // Future.
    t('Move to recovery plates', '2026-08-05', { project: 'PEG Treatment', experiment: 'E0013_PegTreatment' }),
    t('Lab meeting slides', '2026-08-05', { type: 'meeting' }),
    t('Scan second root batch', '2026-08-06', { project: 'Root Atlas' }),
    t('Water the weekend trays', '2026-08-08'),
    t('Call home', '2026-08-08', { scope: 'personal' }),
    t('Harvest GB005', '2026-08-12', { project: 'Globot', experiment: 'GB005' }),
    t('Conference abstract deadline', '2026-08-28', { project: 'Root Atlas' }),
    t('Reread the Zhu paper', null),
  ],
};

const ui = {
  view: new URLSearchParams(location.search).get('view') ?? 'today',
  zoom: new URLSearchParams(location.search).get('zoom') ?? 'month',
  anchor: normaliseAnchor(new URLSearchParams(location.search).get('zoom') ?? 'month', TODAY),
  selected: TODAY,
  editingId: null,
  upcomingOpen: false,
};

function listCtx() {
  return {
    editingId: ui.editingId,
    onToggle: (id) => console.log('toggle', id),
    onOpen: (id) => { ui.editingId = id; draw(); },
    onSaveEdit: (id, c) => { console.log('save', id, c); ui.editingId = null; draw(); },
    onDelete: (id) => { console.log('delete', id); ui.editingId = null; draw(); },
    onCancelEdit: () => { ui.editingId = null; draw(); },
  };
}

function draw() {
  const badge = syncBadge({ status: 'synced', pending: 0, lastSyncedAt: `${TODAY}T09:14:00Z` });
  const node = ui.view === 'calendar'
    ? renderCalendar({
        state, today: TODAY, zoom: ui.zoom, anchor: ui.anchor, selected: ui.selected,
        badge, listCtx: listCtx(),
        onZoom: (z, target) => { ui.zoom = z; ui.anchor = normaliseAnchor(z, target ?? ui.anchor); draw(); },
        onAnchor: (a) => { ui.anchor = normaliseAnchor(ui.zoom, a); draw(); },
        onSelectDay: (iso) => { ui.selected = ui.selected === iso ? null : iso; draw(); },
        onBack: () => { ui.view = 'today'; draw(); },
      })
    : renderToday({
        state, today: TODAY, badge, ...listCtx(),
        upcomingOpen: ui.upcomingOpen,
        onUpcomingToggle: (o) => { ui.upcomingOpen = o; },
        onAdd: (x) => console.log('add', x),
        onSettings: () => console.log('settings'),
        onCalendar: () => { ui.view = 'calendar'; draw(); },
      });
  document.getElementById('view').replaceChildren(node);
}

globalThis.ui = ui;
globalThis.draw = draw;
draw();
</script>
</body>
</html>
